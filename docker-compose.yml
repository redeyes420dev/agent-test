services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=your-openai-api-key
    volumes:
      - .:/app

  frontend:
    build:
      context: ./coding_agent/ui/react_app
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    volumes:
      - ./coding_agent/ui/react_app:/app
    depends_on:
      - backend