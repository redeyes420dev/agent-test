services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CODING_AGENT_OPENAI_API_KEY=sk-test-key-change-me
      - CODING_AGENT_DEBUG=true
      - CODING_AGENT_HOST=0.0.0.0
      - CODING_AGENT_PORT=8000
      - CODING_AGENT_LOG_LEVEL=INFO
      - ENVIRONMENT=production
    volumes:
      - .:/app
    command: ["python", "main.py"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - CODING_AGENT_OPENAI_API_KEY=sk-test-key-change-me
      - CODING_AGENT_DEBUG=true
      - CODING_AGENT_HOST=0.0.0.0
      - ENVIRONMENT=production
    volumes:
      - .:/app
    depends_on:
      - api-gateway
    command: ["python", "-c", "from main import run_frontend; run_frontend()"]