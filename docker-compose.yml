# Docker Compose конфигурация для агента разработки
version: '3.8'

services:
  # Основное приложение агента
  coding-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - BRIGHTDATA_TOKEN=${BRIGHTDATA_TOKEN}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://agent_user:agent_pass@postgres:5432/coding_agent
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./repos:/app/repos
      - ./logs:/app/logs
      - agent_data:/app/data
    depends_on:
      - postgres
      - redis
    networks:
      - agent_network
    restart: unless-stopped

  # База данных PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=coding_agent
      - POSTGRES_USER=agent_user
      - POSTGRES_PASSWORD=agent_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - agent_network
    restart: unless-stopped

  # Redis для кэширования и сессий
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - agent_network
    restart: unless-stopped

  # MCP Sandbox сервер
  mcp-sandbox:
    build:
      context: ./mcp_servers/sandbox
      dockerfile: Dockerfile
    environment:
      - SANDBOX_MODE=secure
      - MAX_EXECUTION_TIME=30
      - MAX_MEMORY=512M
    volumes:
      - sandbox_data:/tmp/sandbox
    networks:
      - mcp_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

  # MCP Testing сервер
  mcp-testing:
    image: node:18-alpine
    working_dir: /app
    command: ["node", "testing-server.js"]
    volumes:
      - ./mcp_servers/testing:/app
    environment:
      - NODE_ENV=production
    networks:
      - mcp_network
    restart: unless-stopped

  # MCP Documentation сервер
  mcp-docs:
    image: node:18-alpine
    working_dir: /app
    command: ["npx", "@modelcontextprotocol/server-docs"]
    environment:
      - NODE_ENV=production
      - DOCS_CACHE_SIZE=1000
    networks:
      - mcp_network
    restart: unless-stopped

  # MCP GitHub сервер
  mcp-github:
    image: node:18-alpine
    working_dir: /app
    command: ["npx", "@modelcontextprotocol/server-github"]
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_TOKEN}
      - NODE_ENV=production
    networks:
      - mcp_network
    restart: unless-stopped

  # MCP Bright Data сервер
  mcp-brightdata:
    image: node:18-alpine
    working_dir: /app
    command: ["npx", "@brightdata/mcp"]
    environment:
      - API_TOKEN=${BRIGHTDATA_TOKEN}
      - NODE_ENV=production
    networks:
      - mcp_network
    restart: unless-stopped

  # Frontend (React приложение)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - coding-agent
    networks:
      - agent_network
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - coding-agent
      - frontend
    networks:
      - agent_network
    restart: unless-stopped

  # Мониторинг с Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - agent_network
    restart: unless-stopped

  # Grafana для визуализации метрик
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - agent_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  agent_data:
  sandbox_data:
  prometheus_data:
  grafana_data:

networks:
  agent_network:
    driver: bridge
  mcp_network:
    driver: bridge
    internal: true  # Изолированная сеть для MCP серверов